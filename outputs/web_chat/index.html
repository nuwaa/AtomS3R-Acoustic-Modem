<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IP Chat</title><style>
:root{color-scheme:dark;--bg:#0c111b;--panel:#151d2b;--line:#29354a;--text:#edf3ff;--muted:#92a1ba;--accent:#64d2ff;--mine:#174d67;--theirs:#263248;--bad:#ff7b72}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Segoe UI","Noto Sans JP","Noto Sans TC",sans-serif;height:100dvh}
main{height:100%;max-width:760px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;background:var(--panel)}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}h1{font-size:18px;margin:0;flex:1}.state{font-size:13px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;display:inline-block;margin-right:6px}.online .dot{background:#3ddc84}
#messages{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.message{max-width:86%;padding:10px 12px;border-radius:14px;background:var(--theirs);overflow-wrap:anywhere}.sent{align-self:flex-end;background:var(--mine)}.meta{font-size:12px;color:var(--muted);margin-bottom:4px}.system{align-self:center;color:var(--muted);font-size:13px}.error{color:var(--bad)}
form{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--panel);padding-bottom:max(10px,env(safe-area-inset-bottom))}input,textarea,button{font:inherit}#name{grid-column:1/-1;background:#0f1623;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px}textarea{resize:none;min-height:48px;max-height:120px;background:#0f1623;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px}button{border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:#00131d;font-weight:700}button:disabled{opacity:.4}
</style></head><body><main><header><h1>IP Chat</h1><div id="state" class="state"><span class="dot"></span>接続中</div></header><section id="messages" aria-live="polite"></section>
<form id="form"><input id="name" maxlength="48" placeholder="表示名" value="Browser"><textarea id="text" maxlength="1000" placeholder="メッセージ（日本語・繁體中文対応）" required></textarea><button id="send" type="submit" disabled>送信</button></form></main>
<script>
const messages=document.querySelector('#messages'),state=document.querySelector('#state'),form=document.querySelector('#form'),nameInput=document.querySelector('#name'),text=document.querySelector('#text'),send=document.querySelector('#send');let ws;
function add(kind,body,meta=''){const item=document.createElement('div');item.className=kind==='system'?'system':`message ${kind}`;if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;item.append(m)}const content=document.createElement('div');content.textContent=body;item.append(content);messages.append(item);messages.scrollTop=messages.scrollHeight}
function connect(){ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onopen=()=>{state.classList.add('online');state.lastChild.textContent='接続済み';send.disabled=false};ws.onclose=()=>{state.classList.remove('online');state.lastChild.textContent='再接続中';send.disabled=true;setTimeout(connect,1500)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='chat')add(m.direction==='sent'?'sent':'received',m.text,`${m.sender}${m.attempt?` · 送信${m.attempt}回目`:''}`);else if(m.type==='error')add('system',m.message,'エラー');else if(m.type==='status')add('system',`${m.name}へ接続しました`)}}
form.addEventListener('submit',e=>{e.preventDefault();const value=text.value;if(!value||ws.readyState!==WebSocket.OPEN)return;ws.send(JSON.stringify({type:'send',sender:nameInput.value||'Browser',text:value}));text.value='';text.focus()});text.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});connect();
</script></body></html>
